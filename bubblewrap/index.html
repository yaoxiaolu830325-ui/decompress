<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bubble Wrap — pop every single one</title>
<meta name="description" content="Infinite bubble wrap you can pop forever. Drag across the sheet, every bubble dents and stays dented. No install, no account.">
<style>
  :root { --bg:#0c1426; --card:#121d33; --ink:#e8eef9; --dim:#7f8ea8; --accent:#22d3ee; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; justify-content:space-between; padding:14px 18px;
    font-size:13px; letter-spacing:.02em; color:var(--dim); z-index:3; }
  header b { color:var(--ink); font-size:15px; letter-spacing:0; }
  #score { font-variant-numeric:tabular-nums; color:var(--accent); font-weight:600; }
  canvas { flex:1; display:block; touch-action:manipulation; }
  #hint { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:3;
    font-size:12px; color:var(--dim); background:rgba(12,20,38,.72); padding:8px 16px;
    border-radius:999px; border:1px solid rgba(255,255,255,.08); backdrop-filter:blur(8px);
    transition:opacity .6s; pointer-events:none; white-space:nowrap; }
  #hint.done { opacity:0; }
  #allDone { position:fixed; inset:0; display:none; place-items:center; z-index:4;
    background:radial-gradient(circle at 50% 40%, rgba(34,211,238,.12), rgba(12,20,38,.92)); }
  #allDone.show { display:grid; }
  #allDone div { text-align:center; }
  #allDone h1 { margin:0 0 8px; font-size:26px; }
  #allDone p { margin:0 0 20px; color:var(--dim); font-size:14px; }
  #allDone button { font:inherit; font-weight:600; color:#04202a; background:var(--accent);
    border:0; border-radius:999px; padding:12px 26px; cursor:pointer; }
  footer { position:fixed; right:14px; bottom:14px; z-index:3; font-size:11px; color:#4a5670; }
  footer a { color:#4a5670; text-decoration:none; border-bottom:1px dotted #33415c; }
</style>
</head>
<body>
<div id="wrap">
  <header>
    <b>Bubble Wrap</b>
    <span><span id="score">0</span> / <span id="total">0</span> popped</span>
  </header>
  <canvas id="c"></canvas>
</div>
<div id="hint">Hold and drag across the sheet →</div>
<div id="allDone"><div><h1>All popped 🎉</h1><p>Still have the urge?</p><button id="again">New sheet</button></div></div>
<footer>made by <a href="https://ko-fi.com/yaoengineering" target="_blank" rel="noopener">Yao Engineering</a></footer>

<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const totalEl = document.getElementById('total');
  const hint = document.getElementById('hint');
  const allDone = document.getElementById('allDone');

  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let W = 0, H = 0, cols = 0, rows = 0, R = 0, GAP = 0;
  let bubbles = [], popped = 0, particles = [];
  let pointerDown = false, lastPop = 0;

  // ---------- audio (no assets) ----------
  let ac = null;
  function ensureAudio() {
    if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (ac && ac.state === 'suspended') ac.resume();
  }
  function popSound(pan) {
    if (!ac) return;
    const t = ac.currentTime;
    const dur = 0.085;
    const buf = ac.createBuffer(1, Math.ceil(ac.sampleRate * dur), ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) {
      const e = Math.pow(1 - i / d.length, 6);
      d[i] = (Math.random() * 2 - 1) * e;
    }
    const src = ac.createBufferSource(); src.buffer = buf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass';
    bp.frequency.value = 1100 + Math.random() * 1400; bp.Q.value = 1.1;
    const g = ac.createGain(); g.gain.value = 0.16;
    const p = ac.createStereoPanner ? ac.createStereoPanner() : null;
    if (p) { p.pan.value = pan; src.connect(bp); bp.connect(g); g.connect(p); p.connect(ac.destination); }
    else { src.connect(bp); bp.connect(g); g.connect(ac.destination); }
    src.start(t); src.stop(t + dur);
  }

  // ---------- layout ----------
  function layout() {
    const rect = canvas.getBoundingClientRect();
    W = rect.width; H = rect.height;
    canvas.width = Math.floor(W * dpr); canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const target = W < 520 ? 74 : 96;          // px per bubble cell
    cols = Math.max(4, Math.round(W / target));
    rows = Math.max(4, Math.round(H / target));
    GAP = Math.min(W / cols, H / rows);
    R = GAP * 0.40;

    const old = bubbles;
    bubbles = [];
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const i = y * cols + x;
        const prev = old[i];
        bubbles.push({
          cx: (x + 0.5) * GAP, cy: headerH() + (y + 0.5) * GAP,
          r: R, popped: prev ? prev.popped : false, t: 0, wob: 0
        });
      }
    }
    totalEl.textContent = bubbles.length;
    popped = bubbles.filter(b => b.popped).length;
    scoreEl.textContent = popped;
    draw();
  }
  function headerH() { return 0; }

  // ---------- interaction ----------
  function pos(e) {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  }
  function hit(x, y, radius) {
    for (let i = bubbles.length - 1; i >= 0; i--) {
      const b = bubbles[i];
      if (b.popped) continue;
      const dx = x - b.cx, dy = y - b.cy;
      if (dx * dx + dy * dy <= (radius || b.r) * (radius || b.r)) return b;
    }
    return null;
  }
  function popAt(x, y) {
    const now = performance.now();
    let hitAny = false;
    // pop anything within brush radius
    bubbles.forEach(b => {
      if (b.popped) return;
      const dx = x - b.cx, dy = y - b.cy;
      if (dx * dx + dy * dy <= (b.r * 1.15) ** 2) {
        b.popped = true; b.t = now; b.wob = (Math.random() - 0.5) * 2;
        popped++; hitAny = true;
        burst(b.cx, b.cy);
      }
    });
    if (hitAny && now - lastPop > 26) {
      lastPop = now;
      popSound(Math.max(-1, Math.min(1, (x / W) * 2 - 1)));
      if (navigator.vibrate) navigator.vibrate(8);
      scoreEl.textContent = popped;
      hint.classList.add('done');
      if (popped >= bubbles.length) setTimeout(() => allDone.classList.add('show'), 420);
    }
    return hitAny;
  }

  function burst(x, y) {
    for (let i = 0; i < 7; i++) {
      const a = Math.random() * Math.PI * 2, s = 0.6 + Math.random() * 2.2;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, r: 1 + Math.random() * 1.8 });
    }
  }

  function onDown(e) { pointerDown = true; ensureAudio(); const p = pos(e); popAt(p.x, p.y); e.preventDefault(); }
  function onMove(e) {
    if (!pointerDown) return;
    const p = pos(e); popAt(p.x, p.y); e.preventDefault();
  }
  function onUp() { pointerDown = false; }

  canvas.addEventListener('mousedown', onDown);
  canvas.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  canvas.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
  window.addEventListener('blur', onUp);

  document.getElementById('again').addEventListener('click', () => {
    bubbles.forEach(b => { b.popped = false; b.t = 0; });
    popped = 0; scoreEl.textContent = 0;
    allDone.classList.remove('show');
    hint.classList.remove('done');
    ensureAudio();
  });

  // ---------- render ----------
  let raf;
  function draw() {
    const now = performance.now();
    ctx.clearRect(0, 0, W, H);

    // soft vignette backdrop
    const g = ctx.createRadialGradient(W * 0.5, H * 0.35, 0, W * 0.5, H * 0.5, Math.max(W, H) * 0.85);
    g.addColorStop(0, '#111c31'); g.addColorStop(1, '#0a111f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

    bubbles.forEach(b => {
      const age = b.popped ? Math.min(1, (now - b.t) / 220) : 0;
      if (b.popped) {
        // dented ring
        ctx.beginPath();
        ctx.arc(b.cx, b.cy, b.r * (1 - 0.22 * age), 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.035)';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(34,211,238,' + (0.18 * (1 - age) + 0.05) + ')';
        ctx.stroke();
      } else {
        // glossy dome
        const grd = ctx.createRadialGradient(
          b.cx - b.r * 0.35, b.cy - b.r * 0.4, b.r * 0.1,
          b.cx, b.cy, b.r * 1.05
        );
        grd.addColorStop(0, 'rgba(255,255,255,0.30)');
        grd.addColorStop(0.45, 'rgba(163,190,220,0.16)');
        grd.addColorStop(1, 'rgba(90,116,150,0.10)');
        ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, Math.PI * 2);
        ctx.fillStyle = grd; ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(255,255,255,0.10)';
        ctx.stroke();
        // specular
        ctx.beginPath();
        ctx.ellipse(b.cx - b.r * 0.3, b.cy - b.r * 0.38, b.r * 0.26, b.r * 0.17, -0.5, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.fill();
      }
    });

    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.035;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(34,211,238,' + (0.5 * p.life) + ')';
      ctx.fill();
    }

    raf = requestAnimationFrame(draw);
  }

  // ---------- boot ----------
  window.addEventListener('resize', () => {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    clearTimeout(window.__rz);
    window.__rz = setTimeout(layout, 120);
  });
  layout();
  draw();
  setTimeout(() => hint.classList.add('done'), 7000);
})();
</script>
</body>
</html>
